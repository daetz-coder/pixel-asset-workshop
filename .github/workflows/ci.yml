name: Offline workflow
on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    # The preinstalled ImageMagick on this macOS image provides the magick CLI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure media tools are available
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v magick >/dev/null || brew install imagemagick
          ffprobe -version
          magick -version
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: ./workbench/setup.sh
      - run: .venv/bin/python -m unittest discover -s tests -v
        working-directory: workbench
